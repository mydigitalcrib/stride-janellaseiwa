five:
  kicker: Worth your time
  headline:
    - Five things
    - to *try this week*
  lead: Pick the one that feels most like your week.
  note: The first one comes from your own Reel, and the second from your own carousel, though its date is unclear. The other three are seasonal prompts from an events listing and two articles, not proof of what your followers want. None of these is a viral trend.
  items:
    - title: Small habits, not perfect routines
      makeItYours: Film one habit you enjoy, from your own point of view.
      what: Your Nov 23 Reel connected small habits with your journey, and people answered with supportive comments.
      more: It had 212 likes and 10 comments when we checked on Nov 27. That says the topic is worth testing again, not that it went viral.
      hook: One tiny thing I do for myself.
      ways:
        - “My routine is not aesthetic every day.”
        - “Small habits, real life.”
        - “One tiny habit I actually look forward to.” The setup, the interruption, then your reflection.
      careful: Share what works for you, not parenting advice.
      brands: Stationery, home
      links:
        - label: Watch your Reel
          url: https://www.instagram.com/janellaseiwa/reel/DgGRTREBE4d/
    - title: Marriage in the little moments
      makeItYours: Ask your partner one lighthearted question, and share only the answers you both approve.
      what: A recent carousel about your relationship drew 763 likes and 31 comments, with people praising the laughter between you.
      more: Its date is unclear (Nov 14 or Nov 20), so treat it as background. It fits the warm couple stories you already tell.
      hook: The thing we still laugh about.
      ways:
        - “Our very unofficial marriage rule.”
        - “One question, two answers.”
        - “We answered separately and this happened.” Agree the question, record both answers, edit in the reactions.
      careful: Only share what you’ve both agreed to.
      brands: Lifestyle, homeware
      links:
        - label: See your carousel
          url: https://www.instagram.com/janellaseiwa/p/Df97bVWgFvv/
    - title: Experiences over more stuff
      makeItYours: A low-cost winter outing diary, or an at-home version.
      what: National Trust’s winter installation at Cliveden opened on Nov 20.
      more: It’s a real UK seasonal example, not a sign of anything going viral. A nearby day out, or a cosy version at home, works just as well.
      hook: A memory instead of another parcel.
      ways:
        - “Our little winter adventure.”
        - “A day out without the perfect plan.”
        - Pick a nearby, accessible outing, film the scenery and talk over it.
      careful: Don’t share where you are while you’re there.
      brands: Experiences, outerwear
