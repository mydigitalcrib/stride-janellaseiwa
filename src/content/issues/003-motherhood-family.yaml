  filming: Your own voiceover and captions go a long way. Whenever you’d rather not show your baby, details from home, hands or your own point of view work just as well.
  careful: Keep it kind and true. Share your own experience, not medical or parenting advice, and leave out recovery or productivity targets. Ask before you film family, and keep your routines and where you are private. The series has no deadline.
