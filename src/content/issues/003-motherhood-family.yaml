# Issue 003 of Janella's site, written for Janella (@janellaseiwa) to read. Made from the Stride Talent research
# PDF "Stride_Janella_Weekly_Trends_2026-11-27" (week Fri Nov 20 to Thu Nov 26, checked Nov 27). Every figure here
# was checked against that PDF. UK spelling.
#
# Left out on purpose, as notes for Stride rather than for Janella: the follower count and her other businesses
# from the creator snapshot, the named brand prospects (and checking campaigns, exclusivity and budgets before
# outreach), "manager's top 3" wording, the link to the original weekly report site, and her newest Reel, which the
# research couldn't open. The relationship carousel has two dates (Nov 14 and Nov 20), so it's background.
# Her series "My Postpartum Exploration Era" is ideas 13 to 16 (this week's new episodes), in its own filter group;
# the research names no brands for the episodes for her, so they have none.
# An idea's "time" is how many shots, steps or ideas it uses: the research gives no lengths per idea.
