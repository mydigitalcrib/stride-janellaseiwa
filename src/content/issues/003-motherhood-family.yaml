challenge:
  kicker: Your challenge this week
  headline:
    - One small habit,
    - "*one honest story.*"
  body: One Reel about a ritual you genuinely enjoy, with no recovery or productivity goal attached.
  steps:
    - Choose a ritual you genuinely enjoy.
    - "Film three clips: the setup, a real-life interruption and the outcome. Add a short voiceover in your own words."
    - Post when it suits you, and ask one question.
  versionsTitle: Our top three for you
  versions:
    - who: The small-habit Reel
      line: “One tiny thing I do for myself.”
    - who: Start your exploration era
      line: “Today I am finally giving it a go.”
    - who: A winter traditions poll
      line: “What’s your favourite low-cost winter tradition?”
  caption: “Small things count.”
  when: Post when it suits you. Look back after 48 hours, and again after a week.
  check: Look at saves, shares, comments that say something real, and how many people watched to the end. If you can share your Instagram Insights with us, we’ll compare them with your last five similar Reels.
  closer: No targets. Just something you enjoy.
  brief: |-
    One small habit, one honest story

    1. Choose a ritual you genuinely enjoy. No recovery or productivity goal.
    2. Film three clips: the setup, a real-life interruption and the outcome. Add a short voiceover in your own words.
    3. Post when it suits you, and ask one question.

    Caption: “Small things count.”

    Then check, after 48 hours and again after a week: saves, shares, comments that say something real, and how many people watched to the end.

    Keep your baby’s routines, and where you are, private.

