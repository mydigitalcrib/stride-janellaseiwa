      makeItYours: A personal buy-or-skip list.
      what: On Nov 25, The Independent covered TUI holiday offers, one sign of the seasonal pressure to spend.
      more: It’s about the sales, not about what your followers think, so make it personal.
      hook: Things I am not buying this week.
      ways:
        - “My wishlist has a budget.”
        - “What I would buy again.”
        - “Buy, skip, keep.” Your own things, why you chose, and ask for tips.
      careful: Don’t claim a saving unless you’ve checked it.
      brands: Retail, resale
      links:
        - label: Read the article
          url: https://www.independent.co.uk/deals/tui-discount-code-b2687092.html
    - title: A cosy night, reimagined
      makeItYours: A grown-up movie night with your partner.
      what: Good Housekeeping updated its family film roundup on Nov 20, a timely prompt for a cosy night in.
      more: It’s a US list and says nothing about what people are actually watching. Make it a date night for the two of you.
      hook: Our very glamorous Friday night.
      ways:
        - “Date night, living-room edition.”
        - “The film we never finished.”
        - Set up snacks, pick a film, and film your grown-up reactions.
      careful: Keep it a night for the two of you, not screen time for the baby.
      brands: Home entertainment
      links:
