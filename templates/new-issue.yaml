# C — What the audience is actually talking about
talking:
  # The link to this section in the bar at the top, e.g. "What moms are saying", "What runners are saying".
  nav: "[[ What they’re saying ]]"
  kicker: Behind the feed
  headline:
    - "[[ What (audience) are ]]"
    - "*actually*"
    - talking about.
  lead: "[[ The questions they're wrestling with this week. ]]"
  questions:
    - text: "[[ A real question from the research, in their words ]]"
      link:
        label: Read the thread
        url: https://example.com/[[replace-with-link]]
    - text: "[[ Another question ]]"
      link:
        label: Read the thread
        url: https://example.com/[[replace-with-link]]
