# Issue {{no}}: {{topic}}. Made from templates/new-issue.yaml by `npm run new-issue`.
#
# How to fill it in:
# - Replace every [[ ... ]] with real words. The finished site won't build while any are left (unless draft is true).
# - A headline is a list of lines. *Words between stars* are set in the serif accent.
# - Put text in "quotes" if it starts with a quote mark, an @, a * or contains ": " (a colon then a space).
# - Never invent creators, numbers or quotes. Every figure needs a source in `originals` at the bottom.
# - src/content/issues/001-motherhood-family.yaml is a finished example to copy from.

number: {{number}}
topic: {{topic}}
start: {{start}}
end: {{end}}
# While true, this issue only shows when you preview on your computer (npm run dev). Set it to false to publish.
draft: true
# False puts a notice on the cover saying the numbers still need checking. Set it to true once they're checked.
figuresChecked: false
# Who this issue is for, on the cover and in the footer. Delete the line to use the usual one from settings.yaml.
audience: {{audience}}
# The line under the headline on the home page while this is the newest issue.
homeLine: "[[ What this audience is talking about, and what they can make this week. ]]"
# Different words for this issue only (any line from `labels:` in src/content/settings.yaml). Delete if not needed.
# labels:
#   ideas:
#     shots: How to make it

headline:
  - "[[ Headline, line 1 ]]"
  - "[[ line 2 ]]"
  - "*[[ line 3, in the serif accent ]]*"
lede: "[[ Two sentences: what's happening this week and why it's worth their time. ]]"
cover:
  quote: "[[ “A short quote or sound that sums up the week” ]]"
  line: "[[ One line that explains it. ]]"

# A — This week in three
week:
  kicker: This week in three
  headline:
    - Three things
    - "*worth knowing*"
  items:
    - title: "[[ First thing worth knowing ]]"
      body: "[[ One or two sentences. ]]"
    - title: "[[ Second thing ]]"
      body: "[[ One or two sentences. ]]"
    - title: "[[ Third thing ]]"
      body: "[[ One or two sentences. ]]"
  tryThis: "[[ The one most useful thing to try, in one line. ]]"
  example:
    body: "[[ The real examples behind it: who posted, when, and what happened (with the date you checked). ]]"
    links:
      - label: "[[ Watch @creator ]]"
        url: https://example.com/[[replace-with-link]]
  beats:
    title: The whole format, in three beats
    items:
      - name: "[[ Beat 1 ]]"
        line: "[[ “What it looks like” ]]"
      - name: "[[ Beat 2 ]]"
        line: "[[ “What it looks like” ]]"
      - name: "[[ Beat 3 ]]"
        line: "[[ What it looks like ]]"
    footer: "[[ One closing line. ]]"

