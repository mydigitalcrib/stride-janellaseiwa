# E — Sounds, signals and brands. Only call a sound trending if the research shows it.
sound:
  kicker: Sound and brands
  headline:
    - "[[ Headline line 1 ]]"
    - "[[ line 2 ]]"
    - "*[[ line 3 ]]*"
  lead: "[[ Is there a sound worth using this week? Say honestly. ]]"
  insteadTitle: "[[ The sound to use / Use this instead ]]"
  instead:
    - "[[ Option 1 ]]"
    - "[[ Option 2 ]]"
    - "[[ Option 3 ]]"
  planning:
    value: "[[ +000% ]]"
    body: "[[ The search or signal behind the number. ]]"
    note: "[[ What it does and doesn't prove. ]]"
  brands:
    title: Brands that fit naturally
    list: "[[ Kinds of brands. ]]"
    line: "[[ One line on how to include them naturally. ]]"
    note: "[[ e.g. These are natural fits only. We haven't checked for open campaigns. ]]"

# F — This week's challenge
challenge:
  kicker: "[[ Your challenge this week ]]"
  headline:
    - "[[ The *“name”* ]]"
    - challenge.
  body: "[[ What the challenge is and why it works. ]]"
  steps:
    - "[[ Step 1 ]]"
    - "[[ Step 2 ]]"
    - "[[ Step 3 ]]"
  versionsTitle: Find your version
  versions:
    - who: "[[ Audience group ]]"
      line: "[[ “Their version” ]]"
    - who: "[[ Audience group ]]"
      line: "[[ “Their version” ]]"
    - who: "[[ Audience group ]]"
      line: "[[ “Their version” ]]"
  caption: "[[ “A caption they can use” ]]"
  when: "[[ When to post ]]"
  check: "[[ How to tell if it worked ]]"
  closer: "[[ One closing line ]]"
  # What "Copy the challenge" copies: everything they need while filming.
  brief: |-
    [[ Challenge name ]]

    1. [[ Step 1 ]]
    2. [[ Step 2 ]]
    3. [[ Step 3 ]]

    Caption: [[ caption ]]

    When to post: [[ when ]]

    Then check: [[ how to tell if it worked ]]

# G — Sources and the fine print
originals:
  kicker: The fine print
  headline:
    - Want to see
    - "*the originals?*"
  notes:
    - "[[ When the numbers were checked ]]"
    - "[[ What the sources do and don't show ]]"
    - "[[ What we couldn't check this week ]]"
    - None of this promises a post will go viral. Your own take is what makes it work.
    - "[[ Who it's for, and please keep it between us ]]"
  groups:
    - title: The videos
      links:
        - label: "[[ @creator on TikTok, date ]]"
          url: https://example.com/[[replace-with-link]]
    - title: The conversations
      links:
        - label: "[[ Thread title ]]"
          url: https://example.com/[[replace-with-link]]
    - title: The searches
      links:
